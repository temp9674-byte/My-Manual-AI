
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Manual AI</title>
<style>
body{font-family:sans-serif;background:#f3f5f9;margin:0;padding:18px;color:#222}
main{max-width:700px;margin:auto}
h1{color:#2457a6}
.card{background:white;padding:16px;margin:14px 0;border-radius:12px;box-shadow:0 2px 8px #0001}
button{background:#2864c5;color:white;border:0;border-radius:8px;padding:10px 14px;margin:5px 3px;cursor:pointer}
button:disabled{opacity:.5}
input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #bbb;border-radius:8px;margin:8px 0}
.small{font-size:13px;color:#666}
.file{border-top:1px solid #ddd;padding:12px 0}
.result{background:#f5f7fb;padding:12px;margin:10px 0;border-radius:8px;white-space:pre-wrap;overflow-wrap:anywhere}
#status{white-space:pre-wrap;color:#2457a6}
</style>
</head>
<body>
<main>
<h1>📚 My Manual AI</h1>
<p>自分専用のマニュアル検索アプリ</p>

<div class="card">
<h3>① PDFマニュアルを登録</h3>
<input id="picker" type="file" accept="application/pdf" multiple>
<button id="add">PDFを登録する</button>
<p id="status">準備完了</p>
<p class="small" id="storage">保存容量を確認中...</p>
</div>

<div class="card">
<h3>② 登録済みマニュアル</h3>
<p id="count">登録数：0</p>
<div id="files">読み込み中...</div>
</div>

<div class="card">
<h3>③ マニュアルを検索</h3>
<input id="question" type="search" placeholder="探したい言葉を入力">
<button id="search">検索する</button>
<div id="results"></div>
</div>
<div class="card">
  <h3>④ AIに質問する</h3>
  <p class="small">
    登録したマニュアルの内容についてAIに質問できます。
  </p>
  <input
    id="appPassword"
    type="password"
    autocomplete="off"
    placeholder="アプリ用パスワード"
  >
  <input
    id="aiQuestion"
    type="text"
    placeholder="例：機械のエラーが出たときの対処方法は？"
  >
  <button id="askAI">AIに質問する</button>
  <p id="aiStatus"></p>
  <div id="aiAnswer"></div>
</div>

<p class="small">PDFの保存と抽出した文章の検索は、この端末内で行います。PDF.jsの読み込みにはインターネット接続が必要です。</p>
</main>

<script type="module">
import * as pdfjsLib from
'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs';

pdfjsLib.GlobalWorkerOptions.workerSrc =
'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs';

const $ = id => document.getElementById(id);
let library;

const dbPromise = new Promise((resolve,reject)=>{
  const request = indexedDB.open('MyManualAI',1);
  request.onupgradeneeded = ()=>{
    const db = request.result;
    if(!db.objectStoreNames.contains('pages')){
      const store = db.createObjectStore('pages',{keyPath:'id'});
      store.createIndex('filename','filename',{unique:false});
    }
  };
  request.onsuccess = ()=>resolve(request.result);
  request.onerror = ()=>reject(request.error);
});

async function savePage(record){
  const db = await dbPromise;
  return new Promise((resolve,reject)=>{
    const tx = db.transaction('pages','readwrite');
    tx.objectStore('pages').put(record);
    tx.oncomplete = resolve;
    tx.onerror = ()=>reject(tx.error);
  });
}

async function getAllPages(){
  const db = await dbPromise;
  return new Promise((resolve,reject)=>{
    const tx = db.transaction('pages','readonly');
    const req = tx.objectStore('pages').getAll();
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error);
  });
}

async function deletePages(filename){
  const db = await dbPromise;
  return new Promise((resolve,reject)=>{
    const tx = db.transaction('pages','readwrite');
    const store = tx.objectStore('pages');
    const req = store.index('filename').openCursor(IDBKeyRange.only(filename));
    req.onsuccess = ()=>{
      const cursor = req.result;
      if(cursor){ cursor.delete(); cursor.continue(); }
    };
    tx.oncomplete = resolve;
    tx.onerror = ()=>reject(tx.error);
  });
}

async function init(){
  try{
    if(!navigator.storage || !navigator.storage.getDirectory){
      throw new Error('このブラウザは端末内PDF保存に対応していません。Chromeで開いてください。');
    }
    const root = await navigator.storage.getDirectory();
    library = await root.getDirectoryHandle('ManualLibrary',{create:true});
    await refresh();
    await updateStorage();
  }catch(e){
    $('status').textContent='初期化エラー：'+e.message;
  }
}

async function updateStorage(){
  if(navigator.storage?.estimate){
    const e=await navigator.storage.estimate();
    const used=(e.usage/1024/1024/1024).toFixed(2);
    const quota=(e.quota/1024/1024/1024).toFixed(2);
    $('storage').textContent=`端末内の使用量：約${used}GB / 使用可能容量：約${quota}GB`;
  }
  if(navigator.storage?.persist){
    await navigator.storage.persist();
  }
}

async function refresh(){
  if(!library)return;
  const names=[];
  for await(const [name,handle] of library.entries()){
    if(handle.kind==='file' && name.toLowerCase().endsWith('.pdf')){
      names.push(name);
    }
  }
  names.sort();
  $('count').textContent=`登録数：${names.length}`;
  $('files').innerHTML='';
  const pages=await getAllPages();
  const extracted=new Set(pages.map(p=>p.filename));

  for(const name of names){
    const handle=await library.getFileHandle(name);
    const file=await handle.getFile();
    const div=document.createElement('div');
    div.className='file';

    const title=document.createElement('strong');
    title.textContent=name;
    const info=document.createElement('p');
    info.className='small';
    info.textContent=`${(file.size/1024/1024).toFixed(1)} MB ・ ${extracted.has(name)?'文字抽出済み':'未抽出'}`;

    const extract=document.createElement('button');
    extract.textContent=extracted.has(name)?'もう一度文字を抽出':'文字を抽出';
    extract.onclick=()=>extractPdf(name,handle,extract);

    const del=document.createElement('button');
    del.textContent='削除';
    del.style.background='#777';
    del.onclick=async()=>{
      if(!confirm(`${name} を削除しますか？`))return;
      await library.removeEntry(name);
      await deletePages(name);
      await refresh();
      await updateStorage();
      $('status').textContent='削除しました';
    };

    div.append(title,info,extract,del);
    $('files').append(div);
  }
  if(!names.length)$('files').textContent='まだPDFは登録されていません';
}

$('add').onclick=async()=>{
  const files=[...$('picker').files];
  if(!files.length){
    $('status').textContent='先にPDFを選択してください';
    return;
  }
  $('add').disabled=true;
  try{
    for(let i=0;i<files.length;i++){
      const file=files[i];
      if(file.type!=='application/pdf' && !file.name.toLowerCase().endsWith('.pdf'))continue;
      $('status').textContent=`登録中 ${i+1}/${files.length}：${file.name}`;
      const handle=await library.getFileHandle(file.name,{create:true});
      const writable=await handle.createWritable();
      await file.stream().pipeTo(writable);
    }
    $('status').textContent='PDFの登録が完了しました';
    $('picker').value='';
    await refresh();
    await updateStorage();
  }catch(e){
    $('status').textContent='登録エラー：'+e.message;
  }finally{
    $('add').disabled=false;
  }
};

async function extractPdf(name,handle,button){
  button.disabled=true;
  try{
    $('status').textContent=`${name} を読み込んでいます...`;
    const file=await handle.getFile();
    const data=await file.arrayBuffer();
    const pdf=await pdfjsLib.getDocument({data}).promise;

    await deletePages(name);

    for(let pageNo=1;pageNo<=pdf.numPages;pageNo++){
      $('status').textContent=
        `文字を抽出中：${name}\n${pageNo} / ${pdf.numPages} ページ`;

      const page=await pdf.getPage(pageNo);
      const content=await page.getTextContent();
      const text=content.items
        .map(item=>item.str)
        .filter(Boolean)
        .join(' ');

      await savePage({
        id:name+'::'+pageNo,
        filename:name,
        page:pageNo,
        text:text
      });
    }

    $('status').textContent=
      `文字抽出が完了しました！\n${pdf.numPages}ページを保存しました`;
    await refresh();
  }catch(e){
    $('status').textContent='抽出エラー：'+e.message;
  }finally{
    button.disabled=false;
  }
}

$('search').onclick=async()=>{
  const keyword=$('question').value.trim().toLowerCase();
  $('results').innerHTML='';
  if(!keyword){
    $('results').textContent='検索する言葉を入力してください';
    return;
  }

  $('results').textContent='検索中...';
  try{
    const pages=await getAllPages();
    const matches=pages.filter(p=>p.text.toLowerCase().includes(keyword));

    $('results').innerHTML='';
    if(!matches.length){
      $('results').textContent='該当する文章が見つかりませんでした。PDFの文字抽出が済んでいるか確認してください。';
      return;
    }

    const heading=document.createElement('p');
    heading.textContent=`検索結果：${matches.length}件`;
    $('results').append(heading);

    for(const item of matches.slice(0,100)){
      const div=document.createElement('div');
      div.className='result';
      const title=document.createElement('strong');
      title.textContent=`${item.filename}（${item.page}ページ）`;
      const body=document.createElement('p');
      const pos=item.text.toLowerCase().indexOf(keyword);
      const start=Math.max(0,pos-100);
      body.textContent=item.text.slice(start,start+350);
      div.append(title,body);
      $('results').append(div);
    }
  }catch(e){
    $('results').textContent='検索エラー：'+e.message;
  }
};

$('askAI').onclick = async () => {
  const password = $('appPassword').value;
  const question = $('aiQuestion').value.trim();

  $('aiAnswer').textContent = '';
  $('aiStatus').textContent = '';

  if (!password) {
    $('aiStatus').textContent = 'アプリ用パスワードを入力してください';
    return;
  }

  if (!question) {
    $('aiStatus').textContent = '質問を入力してください';
    return;
  }

  const button = $('askAI');
  button.disabled = true;

  try {
    $('aiStatus').textContent = 'マニュアルを検索しています...';

    const pages = await getAllPages();

    if (!pages.length) {
      throw new Error('先にPDFの文字を抽出してください');
    }

    // 質問から検索語を作る
    const normalized = question.replace(/\s/g, '');
    const terms = [];

    if (normalized.length <= 2) {
      terms.push(normalized);
    } else {
      for (let i = 0; i < normalized.length - 1; i++) {
        terms.push(normalized.slice(i, i + 2));
      }
    }

    // 関連するページを探す
    const scored = pages.map(page => {
      const text = page.text.toLowerCase();
      let score = 0;

      for (const term of terms) {
        if (text.includes(term.toLowerCase())) {
          score++;
        }
      }

      return { page, score };
    });

    const selected = scored
      .filter(item => item.score > 0)
      .sort((a, b) => b.score - a.score)
      .slice(0, 5);

    if (!selected.length) {
      throw new Error('質問に関連する文章が見つかりませんでした');
    }

    const context = selected.map(item =>
      `【資料名：${item.page.filename}／${item.page.page}ページ】\n${item.page.text}`
    ).join('\n\n');

    $('aiStatus').textContent = 'AIが回答を作成しています...';

    const response = await fetch(
      'https://my-manual-ai.temp9674.workers.dev/',
      {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-App-Password': password
        },
        body: JSON.stringify({
          question,
          context
        })
      }
    );

    const result = await response.json();

    if (!response.ok) {
      throw new Error(
  [result.error, result.detail].filter(Boolean).join('：')
  || 'AIとの通信に失敗しました'
);
    }

    $('aiAnswer').textContent = result.answer;
    $('aiStatus').textContent = '回答が完成しました';

  } catch (error) {
    $('aiStatus').textContent = 'エラー：' + error.message;
  } finally {
    button.disabled = false;
  }
};

init();
</script>
</body>
</html>
